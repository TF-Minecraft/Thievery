cooldown: 3
lockpick-range: -1

traits:
    - thief

keys:
  iron_key:
    item: "m.keys.iron_key"
    strength: 0.2
  gold_key:
    item: "m.keys.gold_key"
    strength: 0.5

lockpicks:
  iron_lockpick:
    item: "m.lockpicks.basic_lockpick_set"
    strength: 0.35
    capacity: 30

keychain:
  item: m.keys.key_chain
  max-keys: 5
  lore-line-start: 5
  model-by-count:
    0: 68
    1: 69
    2: 70
    3: 71
    4: 72
    5: 73

key-copy:
  paper-cooldown-minutes: 240

  mold:
    input: v.clay_ball
    output: m.utils.key_mold

  copy:
    input: v.copper_ingot
    output: m.keys.copper_key

  paper:
    input: v.paper
    output: m.keys.paper_key

doors:
  debug-tool: m.misc.door_locks_debug_tool

category_points: 30
point_gain_interval: 24

default_item_value: 0.1

# Percents on steal base (composition for AC, slug weight for Magic). Gems are not multiplied.
# Missing / unknown quality or unattuned aura band 0 is 0%. aura_mins matches Magic charges.yml bands.default.
item_value:
  quality:
    rusted: -0.20
    tempered: 0.00
    polished: 0.25
    gleaming: 0.50
    masterwork: 0.75
  aura:
    0: 0.00
    1: 0.00
    2: 0.15
    3: 0.40
    4: 0.75
  aura_mins:
    1: 10
    2: 40
    3: 75
    4: 110

clues:
  recent-max: 6
  recent-cooldown-hours: 72
  critical-cooldown-hours: 24
  min-clues-door: 0
  min-clues-container: 1
  risk-gain-door:
    min: 0.05
    max: 0.15
  risk-gain-chest:
    min: 0.025
    max: 0.075
  risk-gain-pickpocket:
    min: 0.04
    max: 0.12
  risk-pick-reduction: 0.5
  risk-decay-per-hour: 0.08
  critical-base: 0.0
  critical-risk-weight: 0.5
  critical-dex-reduction: 0.15
  critical-strength-reduction: 0.2
  take-value-scale: 12.0
  take-value-max-bonus: 0.35
  take-clue-divisor: 10
  critical-clue: "§7This seems to be the work of #d6cf69{character_name}"

lockpicking:
  require-owner-online: false
  debug-allow-own-chest: true
  debug-clue-preview: true
  door-max-distance: 3
  lockpick-max-reduction: 0.5
  min-lock-strength-ratio: 0.5
  max-success-chance: 0.95
  dex-map:
    0: 1.0
    40: 4.0
  fail-cooldown-ms: 60000
  door-unlock-window-minutes: 60
  excluded-containers:
    - ENDER_CHEST
  lockable-furniture:
    - artifact_display
    - pedestal
  lockable-entities:
    - ARMOR_STAND
    - ITEM_FRAME
    - GLOW_ITEM_FRAME
  display-lock-strength: 0.5

  bar:
    length: 20
    max-success-slots: 3
    min-break-slots: 3
    max-break-slots: 19
    base-speed: 2.5
    dex-speed-reduction-per-level: 0.02
    min-speed: 0.4
    speed-jitter-fraction: 0.3
    random-flip-chance: 0.03

  attribute: dexterity

  chest:
    base-success-chance: 1.0
    # The probe menu hides seized pins: probing one snaps the lockpick, and every safe probe counts the
    # seized pins around it. Pins = slots x seized-density x break chance (1 - success chance from
    # Dexterity and pick strength) x the lock type's break-chance-multiplier, plus
    # seized-per-grid-mistake for each mistake in the lock minigame.
    seized-density: 0.3
    seized-per-grid-mistake: 1
    # Pin memory minigame solved before the probe menu opens. Lit pins show for memorise-seconds,
    # then hide; set every pin from memory within recall-seconds (plus recall-seconds-per-dexterity
    # per dexterity level). The grid is up to 6 rows and 9 columns.
    # Failing either minigame, running out of time or giving up applies fail-cooldown-ms to that chest
    # (both halves of a double chest) and may break the lockpick (fail-break-chance).
    minigame:
      enabled: true
      rows: 6
      columns: 6
      pins: 14
      prepare-seconds: 1.0
      memorise-seconds: 4.0
      recall-seconds: 6.0
      recall-seconds-per-dexterity: 0.05
      mistakes-to-fail: 3              # wrong grid cells; the ring has dial.mistakes-to-fail
      fail-break-chance: 0.5
      # The pin grid is a dialog. pack draws it as a lit board from the server resource pack's
      # thievery:lockpick font; turn it on only once the pack carries that font, or players see boxes.
      # Without it, sprites draws its cells as block textures (redstone lamps); false draws coloured
      # squares instead.
      grid:
        pack: false
        sprites: true
      # Share of locks that use the lockpick ring instead of the pin grid. The ring floats in front of
      # the thief, who is held still, and a white pointer sweeps once round it per pass. Press the
      # movement key shown in the middle (each player sees their own binding) while the pointer is in
      # the green zone. Each set tumbler narrows the zone by zone-shrink-per-tumbler and, with
      # alternate-direction, reverses the sweep. A pass takes min-lap-seconds to max-lap-seconds, plus
      # lap-seconds-per-dexterity per Dexterity level. Presses are judged against where the pointer was
      # up to max-lag-ticks ago, from the thief's ping. mistakes-to-fail slips fail the ring (the grid
      # above has its own); sneaking gives up.
      dial-chance: 0.5
      dial:
        tumblers: 4
        mistakes-to-fail: 1
        zone-width: 0.14
        zone-shrink-per-tumbler: 0.15
        min-lap-seconds: 1.44
        max-lap-seconds: 2.08
        lap-seconds-per-dexterity: 0.008
        alternate-direction: true
        max-lag-ticks: 6
        distance: 2.4

  # Multipliers on the chest steal bases. Omitted keys stay at 1.0, and critical-risk stays on.
  # break-chance-multiplier scales the number of seized pins.
  lock-types:
    private: {}
    guild: {}
    faction:
      budget-multiplier: 3.0
      risk-multiplier: 0.5
      critical-risk: false
      break-chance-multiplier: 0.5
    public: {}

robbery:
  traits:
    - bandit
  budget: 30
  cooldown-days: 3
  duration-seconds: 120
  max-distance: 4
  accept-timeout-seconds: 30
  # Robbery GUI slot 8 only. Transfers victim pouch balance to robber pouch via DenarEconomy.
  pouch-click-amount: 10
  pouch-shift-amount: 100
  ignore:
    name-contains:
      - Slot

pickpocket:
  traits:
    - thief
  budget: 10
  cooldown-hours: 1
  max-distance: 4
  alert-subtitle: "#d65c5cSomeone is pickpocketing you!"
  alert-subtitle-critical: "#d65c5c{character_name} is pickpocketing you!"
  # Before a pocket opens, a ring floats in front of the thief, who is held still, and drains while
  # they mash jump to fill it (level 2 of the NoPixel lockpick): two phases, the first half length.
  # Fill both within time-limit-seconds while the mark stays within max-distance. Sneaking gives up.
  # A failed attempt alerts the mark and starts lockpicking.fail-cooldown-ms on them.
  minigame:
    enabled: true
    time-limit-seconds: 30
  ignore:
    name-contains:
      - Slot
